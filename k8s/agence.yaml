apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: agence
data:
  default.conf: |
    server {
        listen 80;
        root /var/www/html/public;
        client_max_body_size 10M;

        location / {
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agence
  namespace: agence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agence
  template:
    metadata:
      labels:
        app: agence
    spec:
      containers:
        - name: app
          image: agence-app:1.0
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: db
            - name: DB_USER
              value: root
            - name: DB_NAME
              value: mohamed_tayeb_agency_premium
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 9000
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/public/uploads/cars
        - name: web
          image: agence-web:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /?page=health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: uploads
              mountPath: /var/www/html/public/uploads/cars
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: uploads
          emptyDir: {}
